[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imbalance-selective"
version = "0.1.0"
description = "Selective classification experiments under class imbalance"
requires-python = ">=3.11"
dependencies = [
  "joblib",
  "kagglehub",
  "lightgbm",
  "numpy",
  "pandas",
  "pyarrow",
  "scikit-learn",
  "pyyaml",
  "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

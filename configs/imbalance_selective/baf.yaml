dataset:
  name: baf_base
  domain: financial_fraud
  source: kaggle_bank_account_fraud_neurips_2022
  kaggle_slug: sgpjesus/bank-account-fraud-dataset-neurips-2022
  local_path: data/raw/baf/Base.parquet
  csv_path: data/raw/baf/Base.csv
  split_assignments_path: data/interim/baf_split_assignments.parquet
  target: fraud_bool
  month_column: month
  positive_label: 1
  split:
    type: temporal
    train_months: [0, 1, 2, 3, 4]
    calibration_months: [5]
    threshold_selection_months: [6]
    test_months: [7]

models:
  smoke_test: logistic_regression
  full: [logistic_regression, lightgbm, mlp]

calibration:
  smoke_test: [none]
  full: [none, platt, isotonic, temperature]

thresholds:
  single_baselines: [default_0_5, macro_f1, balanced_accuracy, mcc]
  abstention_budgets: [0.01, 0.02, 0.05, 0.10]
